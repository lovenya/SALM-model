<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SpeechAudioLM S2A architecture: training and inference</title>
  <desc id="desc">A two-panel diagram showing the speech conditioning and target audio latent branches during training, and speech-conditioned latent diffusion during inference.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#162238" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34445e"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d95c4f"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #17243a; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #516078; }
      .panel-title { font: 700 25px Inter, Arial, sans-serif; fill: #17243a; }
      .panel-note { font: 400 15px Inter, Arial, sans-serif; fill: #5d6a7e; }
      .box-title { font: 700 17px Inter, Arial, sans-serif; fill: #15243a; }
      .box-sub { font: 400 14px Inter, Arial, sans-serif; fill: #45556d; }
      .small { font: 600 13px Inter, Arial, sans-serif; fill: #5a687b; }
      .tiny { font: 400 12px Inter, Arial, sans-serif; fill: #647187; }
      .arrow { fill: none; stroke: #34445e; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-coral { fill: none; stroke: #d95c4f; stroke-width: 2.5; marker-end: url(#arrow-coral); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="70" y="60" class="title">Speech → Environmental Audio with AudioLDM</text>
  <text x="70" y="90" class="subtitle">Our current S2A architecture • no transcription • no contrastive loss in this pilot</text>

  <!-- Legend -->
  <g transform="translate(1070,35)">
    <rect x="0" y="0" width="144" height="34" rx="9" fill="#dcecff" stroke="#5791cf"/>
    <text x="72" y="22" text-anchor="middle" class="small">FROZEN</text>
    <rect x="155" y="0" width="144" height="34" rx="9" fill="#ffe2dc" stroke="#df7569"/>
    <text x="227" y="22" text-anchor="middle" class="small">TRAINABLE</text>
    <rect x="310" y="0" width="150" height="34" rx="9" fill="#f0f2f6" stroke="#9ba7b8" stroke-dasharray="5 4"/>
    <text x="385" y="22" text-anchor="middle" class="small">TRAINING ONLY</text>
  </g>

  <!-- Panels -->
  <rect x="55" y="125" width="745" height="710" rx="22" fill="#ffffff" stroke="#d5dce7" stroke-width="2"/>
  <rect x="820" y="125" width="725" height="710" rx="22" fill="#ffffff" stroke="#d5dce7" stroke-width="2"/>
  <text x="85" y="170" class="panel-title">A. Training</text>
  <text x="850" y="170" class="panel-title">B. Inference</text>
  <text x="85" y="198" class="panel-note">Learn to predict noise while using speech as the condition</text>
  <text x="850" y="198" class="panel-note">Start from random noise and iteratively synthesize audio</text>

  <!-- Training: conditioning branch -->
  <text x="85" y="240" class="small">CONDITIONING BRANCH</text>
  <g filter="url(#shadow)">
    <rect x="85" y="260" width="150" height="76" rx="14" fill="#eef1f6" stroke="#a9b3c1"/>
    <text x="160" y="290" text-anchor="middle" class="box-title">Input speech</text>
    <text x="160" y="314" text-anchor="middle" class="box-sub">waveform</text>

    <rect x="285" y="260" width="190" height="76" rx="14" fill="#dcecff" stroke="#5791cf" stroke-width="1.5"/>
    <text x="380" y="288" text-anchor="middle" class="box-title">Whisper-large-v3</text>
    <text x="380" y="312" text-anchor="middle" class="box-sub">encoder only • frozen</text>

    <rect x="525" y="250" width="205" height="96" rx="14" fill="#ffe2dc" stroke="#df7569" stroke-width="1.5"/>
    <text x="627" y="278" text-anchor="middle" class="box-title">Speech mapper</text>
    <text x="627" y="301" text-anchor="middle" class="box-sub">2 Transformer layers</text>
    <text x="627" y="323" text-anchor="middle" class="box-sub">attention pool → 512-d</text>
  </g>
  <path d="M235 298 H285" class="arrow"/>
  <path d="M475 298 H525" class="arrow"/>
  <text x="500" y="286" text-anchor="middle" class="tiny">frames</text>

  <!-- Training: target branch -->
  <text x="85" y="411" class="small">TARGET-AUDIO BRANCH <tspan font-weight="400">(available only during training)</tspan></text>
  <g filter="url(#shadow)">
    <rect x="85" y="432" width="150" height="76" rx="14" fill="#f0f2f6" stroke="#9ba7b8" stroke-dasharray="5 4"/>
    <text x="160" y="462" text-anchor="middle" class="box-title">Target audio</text>
    <text x="160" y="486" text-anchor="middle" class="box-sub">ground truth</text>

    <rect x="285" y="432" width="190" height="76" rx="14" fill="#dcecff" stroke="#5791cf" stroke-width="1.5"/>
    <text x="380" y="460" text-anchor="middle" class="box-title">Mel + VAE encoder</text>
    <text x="380" y="484" text-anchor="middle" class="box-sub">AudioLDM • frozen</text>

    <rect x="525" y="432" width="205" height="76" rx="14" fill="#f0f2f6" stroke="#9ba7b8" stroke-dasharray="5 4"/>
    <text x="627" y="460" text-anchor="middle" class="box-title">Add noise at t</text>
    <text x="627" y="484" text-anchor="middle" class="box-sub">z₀ + ε → noisy latent zₜ</text>
  </g>
  <path d="M235 470 H285" class="arrow"/>
  <path d="M475 470 H525" class="arrow"/>

  <!-- Training: U-Net and objective -->
  <g filter="url(#shadow)">
    <rect x="445" y="575" width="285" height="112" rx="17" fill="#ffe2dc" stroke="#df7569" stroke-width="2"/>
    <text x="587" y="608" text-anchor="middle" class="box-title">AudioLDM U-Net</text>
    <text x="587" y="633" text-anchor="middle" class="box-sub">inputs: zₜ + timestep t + condition</text>
    <text x="587" y="657" text-anchor="middle" class="box-sub">output: predicted noise ε̂</text>

    <rect x="445" y="735" width="285" height="62" rx="14" fill="#fff4d7" stroke="#d5a840" stroke-width="1.5"/>
    <text x="587" y="762" text-anchor="middle" class="box-title">Diffusion objective</text>
    <text x="587" y="784" text-anchor="middle" class="box-sub">MSE(ε̂, ε)</text>
  </g>
  <path d="M627 346 V550 Q627 560 617 560 H607 V575" class="arrow-coral"/>
  <text x="643" y="535" class="tiny">512-d condition</text>
  <path d="M627 508 V575" class="arrow"/>
  <path d="M587 687 V735" class="arrow-coral"/>
  <path d="M730 470 Q766 470 766 710 Q766 766 730 766" class="arrow dashed"/>
  <text x="772" y="628" class="tiny" transform="rotate(90 772 628)">true noise ε</text>
  <text x="85" y="785" class="panel-note">Updated: mapper + U-Net</text>
  <text x="85" y="809" class="panel-note">Frozen: Whisper, VAE, vocoder</text>

  <!-- Inference -->
  <g filter="url(#shadow)">
    <rect x="855" y="255" width="150" height="72" rx="14" fill="#eef1f6" stroke="#a9b3c1"/>
    <text x="930" y="285" text-anchor="middle" class="box-title">New speech</text>
    <text x="930" y="308" text-anchor="middle" class="box-sub">waveform</text>

    <rect x="1050" y="255" width="190" height="72" rx="14" fill="#dcecff" stroke="#5791cf" stroke-width="1.5"/>
    <text x="1145" y="283" text-anchor="middle" class="box-title">Whisper encoder</text>
    <text x="1145" y="306" text-anchor="middle" class="box-sub">frozen</text>

    <rect x="1285" y="245" width="210" height="92" rx="14" fill="#ffe2dc" stroke="#df7569" stroke-width="1.5"/>
    <text x="1390" y="274" text-anchor="middle" class="box-title">Speech mapper</text>
    <text x="1390" y="298" text-anchor="middle" class="box-sub">trained checkpoint</text>
    <text x="1390" y="320" text-anchor="middle" class="box-sub">→ 512-d condition</text>

    <rect x="855" y="435" width="170" height="76" rx="14" fill="#eef1f6" stroke="#a9b3c1"/>
    <text x="940" y="465" text-anchor="middle" class="box-title">Random noise</text>
    <text x="940" y="489" text-anchor="middle" class="box-sub">initial latent zT</text>

    <rect x="1080" y="415" width="260" height="116" rx="17" fill="#ffe2dc" stroke="#df7569" stroke-width="2"/>
    <text x="1210" y="449" text-anchor="middle" class="box-title">AudioLDM U-Net</text>
    <text x="1210" y="474" text-anchor="middle" class="box-sub">iterative denoising</text>
    <text x="1210" y="499" text-anchor="middle" class="box-sub">conditioned on speech</text>

    <rect x="1080" y="610" width="260" height="78" rx="14" fill="#dcecff" stroke="#5791cf" stroke-width="1.5"/>
    <text x="1210" y="640" text-anchor="middle" class="box-title">VAE decoder + HiFi-GAN</text>
    <text x="1210" y="665" text-anchor="middle" class="box-sub">frozen</text>

    <rect x="1080" y="755" width="260" height="62" rx="14" fill="#daf3e6" stroke="#54a77c" stroke-width="1.5"/>
    <text x="1210" y="782" text-anchor="middle" class="box-title">Generated environment</text>
    <text x="1210" y="804" text-anchor="middle" class="box-sub">16 kHz waveform</text>
  </g>
  <path d="M1005 291 H1050" class="arrow"/>
  <path d="M1240 291 H1285" class="arrow"/>
  <path d="M1390 337 V373 Q1390 388 1375 388 H1230 Q1210 388 1210 415" class="arrow-coral"/>
  <path d="M1025 473 H1080" class="arrow"/>
  <path d="M1210 531 V610" class="arrow"/>
  <path d="M1210 688 V755" class="arrow"/>
  <path d="M1340 473 C1405 473 1405 565 1340 565 C1295 565 1290 536 1300 526" class="arrow dashed"/>
  <text x="1410" y="526" class="tiny">repeat for</text>
  <text x="1410" y="544" class="tiny">sampling steps</text>

  <!-- Footer -->
  <text x="800" y="870" text-anchor="middle" class="subtitle">The target-audio encoder branch is supervision, not a second input at inference.</text>
</svg>
