<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Waveform-to-waveform generation</title><desc id="figure-desc">Two separately trained directions. Speech-to-audio uses a frozen Whisper encoder, a learned pooled conditioner, an AudioLDM U-Net, and frozen waveform decoding. Audio-to-speech uses frozen CLAP scene frames both for a global conditioner and an acoustic content LM. Predicted code-duration pairs expand through a frozen centroid codebook; a learned projector supplies frame-aligned channels to the speech diffusion U-Net. Inference uses only the source waveform and random noise.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#747684"/></marker></defs><style>text{font-family:'DejaVu Sans',sans-serif}</style><rect width="1280" height="670" fill="#fff"/><text x="26" y="31" font-size="24" text-anchor="start" fill="#292936" font-weight="600"><tspan x="26" dy="0">Waveform-to-waveform generation</tspan></text>
<rect x="618" y="16" width="22" height="18" rx="3" fill="#f1ebf8" stroke="#79559a" stroke-width="1.6"/>
<text x="649" y="31" font-size="17" text-anchor="start" fill="#333344" font-weight="400"><tspan x="649" dy="0">Learned / fine-tuned</tspan></text>
<rect x="898" y="16" width="22" height="18" rx="3" fill="#edf5f5" stroke="#527f82" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="929" y="31" font-size="17" text-anchor="start" fill="#333344" font-weight="400"><tspan x="929" dy="0">Frozen</tspan></text>
<rect x="1068" y="16" width="22" height="18" rx="3" fill="#fff" stroke="#93949f" stroke-width="1.6"/>
<text x="1099" y="31" font-size="17" text-anchor="start" fill="#333344" font-weight="400"><tspan x="1099" dy="0">Fixed operation</tspan></text>
<text x="26" y="84" font-size="23" text-anchor="start" fill="#79559a" font-weight="700"><tspan x="26" dy="0">(a)</tspan></text>
<text x="75" y="84" font-size="24" text-anchor="start" fill="#292936" font-weight="600"><tspan x="75" dy="0">Speech → environmental audio</tspan></text>
<g id="s2a-input" data-kind="data"><title>Input. speech. waveform</title><rect x="26" y="142" width="150" height="90" rx="7" fill="#fff" stroke="#bbc0cc" stroke-width="1.8"/>
<text x="101" y="168.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="101" dy="0">Input</tspan></text>
<text x="101" y="194.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="101" dy="0">speech</tspan></text>
<text x="101" y="219.5" font-size="17.00" text-anchor="middle" fill="#575867" font-weight="400"><tspan x="101" dy="0">waveform</tspan></text>
</g>
<g id="whisper" data-kind="frozen"><title>Whisper. large-v3 encoder</title><rect x="218" y="142" width="162" height="90" rx="7" fill="#edf5f5" stroke="#527f82" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="299" y="181.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="299" dy="0">Whisper</tspan></text>
<text x="299" y="206.5" font-size="15.85" text-anchor="middle" fill="#575867" font-weight="400"><tspan x="299" dy="0">large-v3 encoder</tspan></text>
</g>
<g id="s2a-conditioner" data-kind="learned"><title>Conditioner. Transformer + pool. global vector g</title><rect x="422" y="142" width="174" height="90" rx="7" fill="#f1ebf8" stroke="#79559a" stroke-width="1.8"/>
<text x="509" y="170.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="509" dy="0">Conditioner</tspan></text>
<text x="509" y="195.5" font-size="15.28" text-anchor="middle" fill="#575867" font-weight="400"><tspan x="509" dy="0">Transformer + pool</tspan></text>
<text x="509" y="217.5" font-size="15.28" text-anchor="middle" fill="#575867" font-weight="400"><tspan x="509" dy="0">global vector g</tspan></text>
</g>
<g id="s2a-unet" data-kind="learned"><title>AudioLDM. U-Net. latent denoising</title><rect x="650" y="142" width="180" height="90" rx="7" fill="#f1ebf8" stroke="#79559a" stroke-width="1.8"/>
<text x="740" y="168.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="740" dy="0">AudioLDM</tspan></text>
<text x="740" y="194.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="740" dy="0">U-Net</tspan></text>
<text x="740" y="219.5" font-size="17.00" text-anchor="middle" fill="#575867" font-weight="400"><tspan x="740" dy="0">latent denoising</tspan></text>
</g>
<g id="s2a-decoder" data-kind="frozen"><title>VAE decoder. + vocoder. latent → waveform</title><rect x="874" y="142" width="180" height="90" rx="7" fill="#edf5f5" stroke="#527f82" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="964" y="168.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="964" dy="0">VAE decoder</tspan></text>
<text x="964" y="194.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="964" dy="0">+ vocoder</tspan></text>
<text x="964" y="219.5" font-size="16.81" text-anchor="middle" fill="#575867" font-weight="400"><tspan x="964" dy="0">latent → waveform</tspan></text>
</g>
<g id="s2a-output" data-kind="data"><title>Generated. audio. environmental</title><rect x="1098" y="142" width="156" height="90" rx="7" fill="#fff" stroke="#bbc0cc" stroke-width="1.8"/>
<text x="1176" y="168.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="1176" dy="0">Generated</tspan></text>
<text x="1176" y="194.5" font-size="21.00" text-anchor="middle" fill="#292936" font-weight="600"><tspan x="1176" dy="0">audio</tspan></text>
<text x="1176" y="219.5" font-size="17.00" text-anchor="middle" fill="#575867" font-weight="400"><tspan x="1176" dy="0">environmental</tspan></text>
</g>
